name: Publish

# Publishes each crate whose manifest version isn't on crates.io yet, then tags
# `v<parsyng version>`: bump the versions in a commit on `main` first, then run
# this workflow.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only package and verify, don't publish or tag
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "parsyng") | .version')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists; bump the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Skip crates already on crates.io, so a run that failed halfway through
      # publishing can be rerun.
      - name: Find unpublished crates
        id: pending
        run: |
          packages=""
          while read -r name version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "parsyng-publish (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is already published" ;;
              404) packages="$packages -p $name" ;;
              *) echo "::error::Unexpected status $status from crates.io for $name"; exit 1 ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          echo "Publishing:$packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - run: cargo fmt --all --check
      # `debug-attribute-example` intentionally fails to compile (it shows the debug output).
      - run: cargo clippy --workspace --all-targets --features fallback,full --exclude debug-attribute-example -- -D warnings
      - run: just test

      - if: steps.pending.outputs.packages != ''
        run: cargo publish ${{ steps.pending.outputs.packages }} --dry-run
      - if: ${{ !inputs.dry-run && steps.pending.outputs.packages != '' }}
        run: cargo publish ${{ steps.pending.outputs.packages }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Wait up to 10 minutes (instead of 60s) for each crate to reach the
          # index before publishing the crates depending on it.
          CARGO_UNSTABLE_PUBLISH_TIMEOUT: "true"
          CARGO_PUBLISH_TIMEOUT: "600"

      - name: Tag and release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
