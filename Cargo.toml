[workspace]
resolver = "3"
members = [
  "crates/parsyng-quote-macros",
  "crates/parsyng-proc-macros",
  "crates/parsyng-core",
  "crates/parsyng-fallback",

  "benches/runtime",
  "benches/bench-comptime",
  "benches/bench-quote-comptime",
  "benches/bench-expansion",
  "benches/bench-parse",

  "examples/simple-use",
  "examples/simple-use-macros",
  "examples/heapsize/heapsize",
  "examples/heapsize/heapsize-macros",
  "examples/heapsize/example",
  "examples/debug-attribute/debug-attribute-macros",
  "examples/debug-attribute/example",
  "examples/errors/errors-macros",
  "examples/errors/example",
]

[package]
name = "parsyng"
description = "A from-scratch, fast-compiling replacement for `syn` + `quote` for writing procedural macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jthillard/parsyng"
documentation = "https://docs.rs/parsyng"
rust-version = "1.95"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = ["proc-macro", "syn", "quote", "parser", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[dependencies]
parsyng-proc-macros = { version = "=0.1.0", path = "./crates/parsyng-proc-macros", optional = true }
parsyng-core = { version = "=0.1.0", path = "./crates/parsyng-core", default-features = false }
parsyng-quote-macros = { version = "=0.1.0", path = "./crates/parsyng-quote-macros" }

[features]
default = ["parsing"]
# The `Parse` machinery, the Rust AST and the helper attributes. Disable
# default features for a `quote!`-only dependency that compiles much faster.
parsing = ["dep:parsyng-proc-macros", "parsyng-core/parsing"]
# The whole Rust grammar (expressions, statements, patterns, every item kind,
# whole source files). Without it, the AST covers what derive macros need.
full = ["parsing", "parsyng-core/full"]
# Use `parsyng-fallback`, a pure-Rust implementation of the token types,
# instead of the compiler's `proc_macro`: for tests and other code running
# outside of macro expansion. Enabling it in a proc-macro crate works, but
# loses spans.
fallback = ["parsyng-core/fallback"]
# `Debug` implementations for the AST and combinator types.
extra-traits = ["parsyng-core/extra-traits"]
# Pipe the output of `#[parsyng::proc_macro(debug)]` & co. through `rustfmt`.
debug-pretty = ["parsyng-core/debug-pretty"]


[package.metadata.docs.rs]
# Not `fallback`: document the compiler's `proc_macro` token types.
features = ["full", "extra-traits"]
rustdoc-args = ["--cfg", "docsrs"]
