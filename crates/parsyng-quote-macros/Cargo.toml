[package]
name = "parsyng-quote-macros"
description = "Quote macros used in `parsyng`"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/supersurviveur/parsyng"
documentation = "https://docs.rs/parsyng-quote-macros"
rust-version = "1.95"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = ["macros", "proc", "quote"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dev-dependencies]
parsyng = { path = "../..", features = ["fallback"] }
