[package]
name = "parsyng-core"
description = "Core components of `parsyng`"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/supersurviveur/parsyng"
documentation = "https://docs.rs/parsyng-core"
rust-version = "1.95"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = ["proc-macro", "syn", "quote", "parser", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[dependencies]
unicode-ident = { version = "1", optional = true }

# Optional dependencies
parsyng-fallback = { version = "=0.1.0", path = "../parsyng-fallback", optional = true }

[dev-dependencies]
parsyng-quote-macros = { version = "0.1.0", path = "../parsyng-quote-macros" }

[features]
default = ["parsing"]
# The `Parse` machinery and the Rust AST. Without it, only `quote!`,
# `quote_spanned!`, `format_ident!` and `ToTokens` are available, which
# compiles much faster.
parsing = ["dep:unicode-ident"]
# The whole Rust grammar: expressions, statements, patterns, function
# signatures, every item kind ([`ast::item::Item`]) and whole source files.
# Without it, the AST covers what derive macros need: types, paths,
# generics, attributes, visibility, literals, structs and enums.
full = ["parsing"]
# Use `parsyng-fallback`, a pure-Rust implementation of the token types,
# instead of the compiler's `proc_macro`: for tests and other code running
# outside of macro expansion. Enabling it in a proc-macro crate works, but
# loses spans.
fallback = ["dep:parsyng-fallback"]
# `Debug` implementations for the AST and combinator types.
extra-traits = []
# Pipe the output of `#[parsyng::proc_macro(debug)]` & co. through `rustfmt`.
debug-pretty = []

[package.metadata.docs.rs]
# Not `fallback`: document the compiler's `proc_macro` token types.
features = ["full", "extra-traits"]
rustdoc-args = ["--cfg", "docsrs"]
