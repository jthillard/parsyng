[package]
name = "parsyng-bench-runtime"
description = "Demo program used to bench `parsyng` runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/supersurviveur/parsyng"
keywords = ["macros", "proc", "quote"]
categories = ["development-tools::procedural-macro-helpers"]

[[bin]]
name = "parsyng"
path = "main.rs"

[[bin]]
name = "parsyng-quote"
path = "parsyng-quote.rs"

[dev-dependencies]
syn = "2"
quote = "1"
parsyng-core = { path = "../crates/parsyng-core", features = ["proc-macro2"] }
