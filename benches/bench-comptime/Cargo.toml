[package]
name = "bench-comptime"
description = "Demo program used to bench compilation time of `parsyng`"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/supersurviveur/parsyng"
keywords = ["macros", "proc", "quote"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
quote = { version = "1", optional = true }
syn = { version = "2", optional = true, features = ["full"] }
unsynn = { version = "0.3", optional = true, default-features = false, features = ["proc_macro2"] }
parsyng = { path = "../../", optional = true }

[features]
syn = ["dep:syn", "dep:quote"]
unsynn = ["dep:unsynn"]
parsyng = ["dep:parsyng"]
proc-macro2 = ["parsyng/proc-macro2"]

empty = []
small = []
big = []
